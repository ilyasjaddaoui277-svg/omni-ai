<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account — OmniAI</title>
  <meta name="description" content="OmniAI — sign in or create your account.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%236366f1'/><stop offset='1' stop-color='%23a855f7'/></linearGradient></defs><rect width='100' height='100' rx='24' fill='%23090a0f'/><path d='M30 62 L50 30 L70 62' stroke='url(%23g)' stroke-width='9' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tw-compiled.min.css">
  <link rel="stylesheet" href="assets/css/style.min.css">
</head>
<body class="bg-ink font-sans text-[15px]">
  <div class="bg-glow" aria-hidden="true"></div>
  <main class="relative flex min-h-screen items-center justify-center px-5 py-16">
    <div class="grid-bg" aria-hidden="true"></div>
    <div class="w-full max-w-md">
      <a href="index.html" class="mb-9 flex items-center justify-center gap-2.5" aria-label="OmniAI home">
        <svg width="36" height="36" viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#a855f7"/></linearGradient></defs><rect width="100" height="100" rx="24" fill="rgba(139,92,246,.12)"/><path d="M30 62 L50 30 L70 62" stroke="url(#lg)" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="text-xl font-bold">Omni<span class="text-gradient">AI</span></span>
      </a>

      <div class="glass p-8 sm:p-9">
        <div class="flex items-center justify-between">
          <h1 class="text-2xl font-bold tracking-tight">Create your account</h1>
          <span class="rounded-full bg-emerald-500/15 px-3 py-1 text-[11px] font-bold text-emerald-400">14-day free trial</span>
        </div>
        <p class="mt-2 text-sm text-muted">Start unifying your AI stack in minutes.</p>

        <div class="mt-7 grid grid-cols-2 gap-3">
          <a href="#" class="btn-ghost !py-2.5 text-sm">
            <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path fill="#EA4335" d="M12 5.1c1.7 0 3.2.6 4.4 1.7l3.3-3.3C17.6 1.9 15 1 12 1 7.6 1 3.8 3.5 1.9 7.1l3.9 3C6.5 7.4 9 5.1 12 5.1z"/><path fill="#4285F4" d="M23 12.3c0-.9-.1-1.5-.2-2.3H12v4.1h6.2c-.1 1-.8 2.6-2.3 3.6l3.6 2.8c2.2-2 3.5-4.9 3.5-8.2z"/><path fill="#FBBC05" d="M5.8 14.1a6.8 6.8 0 0 1 0-4.2l-3.9-3a11 11 0 0 0 0 10.2l3.9-3z"/><path fill="#34A853" d="M12 23c3 0 5.5-1 7.3-2.7l-3.6-2.8c-1 .7-2.3 1.1-3.7 1.1-3 0-5.5-2.3-6.2-5.5l-3.9 3C3.8 20.5 7.6 23 12 23z"/></svg>
            Google
          </a>
          <a href="#" class="btn-ghost !py-2.5 text-sm">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2C6.5 2 2 6.6 2 12.3c0 4.6 3 8.4 7 9.8.5.1.7-.2.7-.5v-1.8c-2.9.6-3.5-1.4-3.5-1.4-.4-1.2-1.1-1.5-1.1-1.5-.9-.6.1-.6.1-.6 1 .1 1.5 1 1.5 1 .9 1.6 2.4 1.1 3 .9.1-.7.4-1.1.6-1.4-2.3-.3-4.7-1.2-4.7-5.2 0-1.2.4-2.1 1-2.9-.1-.2-.4-1.3.1-2.7 0 0 .8-.3 2.8 1.1a9.4 9.4 0 0 1 5 0c2-1.4 2.8-1.1 2.8-1.1.5 1.4.2 2.5.1 2.7.6.8 1 1.7 1 2.9 0 4-2.4 4.9-4.7 5.2.4.3.7.9.7 1.9v2.8c0 .3.2.6.7.5 4-1.4 7-5.2 7-9.8C22 6.6 17.5 2 12 2z"/></svg>
            GitHub
          </a>
        </div>

        <div class="my-6 flex items-center gap-4" aria-hidden="true">
          <span class="h-px flex-1 bg-white/8"></span>
          <span class="text-xs text-muted">or with email</span>
          <span class="h-px flex-1 bg-white/8"></span>
        </div>

        <form action="#" method="post" novalidate>
          <div class="space-y-4">
            <div class="grid gap-4 sm:grid-cols-2">
              <div>
                <label for="first-name" class="mb-1.5 block text-sm font-medium text-slate-300">First name</label>
                <input type="text" id="first-name" name="first-name" class="field" placeholder="Alex" autocomplete="given-name" required>
              </div>
              <div>
                <label for="last-name" class="mb-1.5 block text-sm font-medium text-slate-300">Last name</label>
                <input type="text" id="last-name" name="last-name" class="field" placeholder="Carter" autocomplete="family-name" required>
              </div>
            </div>
            <div>
              <label for="email" class="mb-1.5 block text-sm font-medium text-slate-300">Work email</label>
              <input type="email" id="email" name="email" class="field" placeholder="you@company.com" autocomplete="email" required>
            </div>
            <div>
              <label for="password" class="mb-1.5 block text-sm font-medium text-slate-300">Password</label>
              <input type="password" id="password" name="password" class="field" placeholder="Minimum 8 characters" autocomplete="new-password" minlength="8" required>
              <div class="mt-2.5 flex gap-1.5" aria-hidden="true">
                <span class="h-1 flex-1 rounded-full bg-emerald-400"></span>
                <span class="h-1 flex-1 rounded-full bg-emerald-400"></span>
                <span class="h-1 flex-1 rounded-full bg-violet-500"></span>
                <span class="h-1 flex-1 rounded-full bg-white/10"></span>
              </div>
            </div>
            <label class="flex cursor-pointer items-start gap-2.5 text-sm text-muted">
              <input type="checkbox" name="terms" class="mt-0.5 h-4 w-4 rounded accent-violet-500" required>
              <span>I agree to the <a href="#" class="font-semibold text-violet-300 hover:text-violet-200">Terms of Service</a> and <a href="#" class="font-semibold text-violet-300 hover:text-violet-200">Privacy Policy</a></span>
            </label>
          </div>
          <a href="dashboard.html" class="btn-primary mt-6 w-full">Create account</a>
        </form>

        <p class="mt-6 text-center text-sm text-muted">
          Already have an account? <a href="auth-login.html" class="font-semibold text-violet-300 hover:text-violet-200 transition-colors">Sign in</a>
        </p>
      </div>
      <p class="mt-6 text-center text-xs text-muted">No credit card required · Cancel anytime</p>
    </div>
  </main>
  <script src="assets/js/main.min.js"></script>
</body>
</html>
